openapi: 3.0.3
info:
  title: Table Order API
  version: 1.0.0
  description: |
    테이블오더 MVP API 계약 (contract-first).

    - 이 파일이 프론트엔드 타입 생성, 가짜 API, 백엔드 구현 검증의 공통 기준이다.
    - 고객용은 `/api/customer/*`(테이블 토큰), 관리자용은 `/api/admin/*`(관리자 토큰)이다.
    - 금액은 원 단위 정수이다. 시각은 ISO 8601(UTC offset 포함)이다.
    - 오류 응답 본문은 모두 `ApiErrorBody` 형식이다.

    ### 계약 요구사항 (백엔드 구현 시 준수)
    1. `POST /api/customer/orders`는 `clientOrderId`로 멱등하다. 같은 ID로 재전송하면 새 주문을 만들지 않고 기존 주문을 200으로 반환한다.
    2. `GET /api/admin/dashboard`는 `table` 파라미터가 없으면 테이블별 최신 3건(`orders`)만, 있으면 해당 테이블의 현재 세션 전체 주문을 최신순으로 반환한다.
    3. 목록(고객 주문 내역)은 `OrderPage` 형식(`page`는 0부터)이다.
    4. 주문 상태 전이는 PENDING -> PREPARING -> COMPLETED 순차만 허용한다 (위반 시 409 INVALID_TRANSITION).
    5. `PUT /api/admin/menus/reorder`는 `/api/admin/menus/{menuId}`보다 먼저 라우팅되어야 한다.

    ### SSE 규격 (`GET /api/admin/events`)
    - `Content-Type: text/event-stream`. Authorization 헤더로 관리자 토큰을 전달한다.
    - 이벤트 이름은 `ServerEvent.type`과 같고, `data`는 `ServerEvent` JSON 한 줄이다.
    - 연결 유지를 위해 주기적으로 주석 줄(`: keep-alive`)을 보낸다.
    - 이벤트 종류: `order_created`, `order_status_changed`, `order_deleted`, `session_ended`, `menu_changed`.
servers:
  - url: /
    description: 같은 오리진(FastAPI가 프론트엔드를 정적 서빙)

tags:
  - name: customer-auth
  - name: customer-menu
  - name: customer-orders
  - name: admin-auth
  - name: admin-orders
  - name: admin-tables
  - name: admin-menus

paths:
  /api/customer/auth/login:
    post:
      tags: [customer-auth]
      operationId: customerLogin
      summary: 테이블 로그인 (자동 로그인 포함)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableLoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/AccountLocked'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/customer/menus:
    get:
      tags: [customer-menu]
      operationId: getCustomerMenus
      summary: 카테고리별 메뉴 조회 (노출 순서 반영)
      security:
        - tableBearer: []
      responses:
        '200':
          description: 카테고리별 메뉴
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryMenus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/customer/orders:
    post:
      tags: [customer-orders]
      operationId: createOrder
      summary: 주문 생성 (clientOrderId 멱등)
      security:
        - tableBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: 주문 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: 같은 clientOrderId로 이미 생성된 주문 (멱등 응답)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [customer-orders]
      operationId: listSessionOrders
      summary: 현재 테이블 세션의 주문 내역 (최신순)
      security:
        - tableBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 주문 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/auth/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: 관리자 로그인 (연속 5회 실패 시 15분 잠금)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: 로그인 성공 (16시간 유효 JWT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/AccountLocked'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/dashboard:
    get:
      tags: [admin-orders]
      operationId: getDashboard
      summary: 테이블별 주문 요약 (테이블 번호 오름차순)
      security:
        - adminBearer: []
      parameters:
        - name: table
          in: query
          required: false
          description: 지정하면 해당 테이블의 현재 세션 전체 주문을 반환한다.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 테이블 요약 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [admin-orders]
      operationId: getOrder
      summary: 주문 상세
      security:
        - adminBearer: []
      responses:
        '200':
          description: 주문 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [admin-orders]
      operationId: deleteOrder
      summary: 주문 삭제 (직권 수정). 삭제 후 갱신된 테이블 요약 반환
      security:
        - adminBearer: []
      responses:
        '200':
          description: 삭제됨 (해당 테이블의 재계산된 요약)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/orders/{orderId}/status:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    patch:
      tags: [admin-orders]
      operationId: changeOrderStatus
      summary: 주문 상태 변경 (순차 전이만)
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChangeRequest'
      responses:
        '200':
          description: 변경된 주문
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/events:
    get:
      tags: [admin-orders]
      operationId: streamAdminEvents
      summary: 실시간 이벤트 스트림 (SSE)
      security:
        - adminBearer: []
      responses:
        '200':
          description: text/event-stream. 각 이벤트의 data는 ServerEvent JSON.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ServerEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/tables:
    get:
      tags: [admin-tables]
      operationId: listTables
      summary: 등록된 테이블 목록 (번호 오름차순)
      security:
        - adminBearer: []
      responses:
        '200':
          description: 테이블 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TableInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin-tables]
      operationId: registerTable
      summary: 테이블 등록 (번호 + 숫자 4자리 비밀번호)
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableRegisterRequest'
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/tables/{tableId}/end-session:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      tags: [admin-tables]
      operationId: endSession
      summary: 테이블 이용 완료 (세션 종료, 주문을 과거 이력으로 이동)
      security:
        - adminBearer: []
      responses:
        '200':
          description: 세션 종료됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/tables/{tableId}/history:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      tags: [admin-tables]
      operationId: getTableHistory
      summary: 테이블 과거 주문 내역 (시간 역순, 날짜 필터)
      security:
        - adminBearer: []
      parameters:
        - name: from
          in: query
          required: false
          description: 시작일 (포함)
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 종료일 (포함)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 과거 주문
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/menus:
    get:
      tags: [admin-menus]
      operationId: listAdminMenus
      summary: 카테고리별 메뉴 조회
      security:
        - adminBearer: []
      responses:
        '200':
          description: 카테고리별 메뉴
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryMenus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin-menus]
      operationId: createMenu
      summary: 메뉴 등록
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuInput'
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/menus/reorder:
    put:
      tags: [admin-menus]
      operationId: reorderMenus
      summary: 카테고리 내 메뉴 노출 순서 변경
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
      responses:
        '204':
          description: 변경됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/menus/{menuId}:
    parameters:
      - $ref: '#/components/parameters/MenuId'
    put:
      tags: [admin-menus]
      operationId: updateMenu
      summary: 메뉴 수정
      security:
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuInput'
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [admin-menus]
      operationId: deleteMenu
      summary: 메뉴 삭제
      security:
        - adminBearer: []
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    tableBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 테이블 로그인으로 발급된 토큰 (16시간)
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 관리자 로그인으로 발급된 토큰 (16시간)

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 0부터 시작하는 페이지 번호
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: 페이지 크기
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
    TableId:
      name: tableId
      in: path
      required: true
      schema:
        type: integer
    MenuId:
      name: menuId
      in: path
      required: true
      schema:
        type: integer

  responses:
    Unauthorized:
      description: 인증 실패 (INVALID_CREDENTIALS 또는 UNAUTHORIZED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
    NotFound:
      description: 대상 없음 (NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
    Conflict:
      description: 상태 충돌 (MENU_UNAVAILABLE, PRICE_CHANGED, INVALID_TRANSITION, NO_ACTIVE_SESSION, DUPLICATE_TABLE)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
    ValidationError:
      description: 입력 검증 실패 (VALIDATION_ERROR, fields 포함)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
    AccountLocked:
      description: 로그인 잠금 (ACCOUNT_LOCKED, retryAfterSeconds 포함)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
    InternalError:
      description: 서버 내부 오류 (INTERNAL_ERROR)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'

  schemas:
    ErrorCode:
      type: string
      enum:
        - INVALID_CREDENTIALS
        - UNAUTHORIZED
        - ACCOUNT_LOCKED
        - VALIDATION_ERROR
        - NOT_FOUND
        - MENU_UNAVAILABLE
        - PRICE_CHANGED
        - INVALID_TRANSITION
        - NO_ACTIVE_SESSION
        - DUPLICATE_TABLE
        - INTERNAL_ERROR

    ApiErrorBody:
      type: object
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        fields:
          type: object
          description: VALIDATION_ERROR 시 필드명 -> 사유
          additionalProperties:
            type: string
        retryAfterSeconds:
          type: integer
          description: ACCOUNT_LOCKED 시 남은 잠금 시간(초)
        details:
          type: object
          properties:
            menuIds:
              type: array
              items:
                type: integer
            currentPrices:
              type: array
              items:
                type: object
                required: [menuId, price]
                properties:
                  menuId:
                    type: integer
                  price:
                    type: integer

    OrderStatus:
      type: string
      enum: [PENDING, PREPARING, COMPLETED]

    TableLoginRequest:
      type: object
      required: [storeId, tableNumber, password]
      properties:
        storeId:
          type: string
          minLength: 1
          maxLength: 50
        tableNumber:
          type: integer
          minimum: 1
          maximum: 999
        password:
          type: string
          pattern: '^\d{4}$'

    AdminLoginRequest:
      type: object
      required: [storeId, username, password]
      properties:
        storeId:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    TokenResponse:
      type: object
      required: [accessToken, expiresAt]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time

    TableTokenResponse:
      type: object
      required: [accessToken, expiresAt, tableId, tableNumber]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        tableId:
          type: integer
        tableNumber:
          type: integer

    Menu:
      type: object
      required: [id, name, price, description, category, imageUrl, displayOrder]
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: integer
        description:
          type: string
        category:
          type: string
        imageUrl:
          type: string
          nullable: true
        displayOrder:
          type: integer

    CategoryMenus:
      type: object
      required: [category, menus]
      properties:
        category:
          type: string
        menus:
          type: array
          items:
            $ref: '#/components/schemas/Menu'

    MenuInput:
      type: object
      required: [name, price, description, category, imageUrl]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        price:
          type: integer
          minimum: 100
          maximum: 1000000
        description:
          type: string
          maxLength: 300
        category:
          type: string
          minLength: 1
          maxLength: 30
        imageUrl:
          type: string
          nullable: true
          description: 선택. 값이 있으면 http 또는 https URL

    ReorderRequest:
      type: object
      required: [category, orderedIds]
      properties:
        category:
          type: string
        orderedIds:
          type: array
          description: 해당 카테고리 전체 메뉴 ID를 원하는 순서로
          items:
            type: integer

    OrderItem:
      type: object
      required: [menuId, menuName, quantity, unitPrice]
      properties:
        menuId:
          type: integer
        menuName:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: integer

    Order:
      type: object
      required: [id, orderNumber, tableId, tableNumber, sessionId, createdAt, status, totalAmount, items]
      properties:
        id:
          type: integer
        orderNumber:
          type: string
        tableId:
          type: integer
        tableNumber:
          type: integer
        sessionId:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/OrderStatus'
        totalAmount:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    OrderCreateItem:
      type: object
      required: [menuId, quantity]
      properties:
        menuId:
          type: integer
        quantity:
          type: integer
          minimum: 1
          maximum: 20

    OrderCreateRequest:
      type: object
      required: [clientOrderId, items, clientTotal]
      properties:
        clientOrderId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderCreateItem'
        clientTotal:
          type: integer
          description: 클라이언트 계산 합계. 서버는 신뢰하지 않고 재계산하여 다르면 PRICE_CHANGED

    OrderPage:
      type: object
      required: [items, page, size, hasNext]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        page:
          type: integer
        size:
          type: integer
        hasNext:
          type: boolean

    StatusChangeRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'

    TableSummary:
      type: object
      required: [tableId, tableNumber, sessionActive, totalAmount, orderCount, orders]
      properties:
        tableId:
          type: integer
        tableNumber:
          type: integer
        sessionActive:
          type: boolean
        totalAmount:
          type: integer
        orderCount:
          type: integer
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'

    TableInfo:
      type: object
      required: [id, tableNumber, sessionActive]
      properties:
        id:
          type: integer
        tableNumber:
          type: integer
        sessionActive:
          type: boolean

    TableRegisterRequest:
      type: object
      required: [tableNumber, password]
      properties:
        tableNumber:
          type: integer
          minimum: 1
          maximum: 999
        password:
          type: string
          pattern: '^\d{4}$'

    SessionSummary:
      type: object
      required: [tableId, endedAt, archivedOrderCount, archivedTotalAmount]
      properties:
        tableId:
          type: integer
        endedAt:
          type: string
          format: date-time
        archivedOrderCount:
          type: integer
        archivedTotalAmount:
          type: integer

    HistoryOrder:
      type: object
      required: [orderId, orderNumber, tableNumber, createdAt, items, totalAmount, completedAt]
      properties:
        orderId:
          type: integer
        orderNumber:
          type: string
        tableNumber:
          type: integer
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totalAmount:
          type: integer
        completedAt:
          type: string
          format: date-time
          description: 테이블 이용 완료 시각

    ServerEvent:
      type: object
      required: [type, tableId, payload]
      properties:
        type:
          type: string
          enum: [order_created, order_status_changed, order_deleted, session_ended, menu_changed]
        tableId:
          type: integer
          nullable: true
        payload:
          type: object
          additionalProperties: true
